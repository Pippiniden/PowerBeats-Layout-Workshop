<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Generate PowerBeatsVR custom layouts from your own MP3/WAV: tempo detection, silence skipping, energy-based density, repeated-section reuse and a boxercise combination mode.">
</head>
<body>
<title>PowerBeats Layout Workshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one reading column of four "rounds" (steps), tool panels inside; timeline spans the column. */
:root{
  --bg:#eef0f4; --surface:#f8f9fb; --raise:#ffffff; --ink:#161b26; --muted:#5d6678; --line:#d6dbe4;
  --accent:#cf2f2a; --accent-ink:#ffffff; --accent-soft:#f7e1df; --focus:#2a66cf; --silent:#cfd4de; --ok:#13897c; --warn:#b86e00;
  --c-BALLS:#cf2f2a; --c-STREAM:#13897c; --c-SWINGS:#d68000; --c-SQUAT:#7446d1; --c-DODGE:#2a66cf; --c-WALLS:#6b7385;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f131a; --surface:#151b24; --raise:#1b222e; --ink:#e6eaf1; --muted:#939cad; --line:#2a3241;
  --accent:#ff5b4f; --accent-ink:#1a0d0c; --accent-soft:#3a1f20; --focus:#6b9dff; --silent:#283041; --ok:#2cc2b0; --warn:#f0a63a;
  --c-BALLS:#ff5b4f; --c-STREAM:#2cc2b0; --c-SWINGS:#f5a524; --c-SQUAT:#a07cff; --c-DODGE:#5b95ff; --c-WALLS:#98a1b3;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0f131a; --surface:#151b24; --raise:#1b222e; --ink:#e6eaf1; --muted:#939cad; --line:#2a3241;
  --accent:#ff5b4f; --accent-ink:#1a0d0c; --accent-soft:#3a1f20; --focus:#6b9dff; --silent:#283041; --ok:#2cc2b0; --warn:#f0a63a;
  --c-BALLS:#ff5b4f; --c-STREAM:#2cc2b0; --c-SWINGS:#f5a524; --c-SQUAT:#a07cff; --c-DODGE:#5b95ff; --c-WALLS:#98a1b3;
  color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;padding-inline:clamp(16px,4vw,32px);padding-block:0 64px}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3{line-height:1.25;text-wrap:balance;margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
small,.hint{color:var(--muted);font-size:13px}

/* header */
.top{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;padding-block:28px 20px;border-bottom:3px solid var(--ink)}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
.mark{flex:none;width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.02em}
.brand h1{font-size:clamp(24px,3.4vw,34px);font-weight:700;letter-spacing:.01em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13.5px;max-width:62ch}
.topright{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.langseg button{padding:4px 12px;font-size:14px;font-family:var(--f-body);letter-spacing:0}
.foot{padding-block:22px 0;font-size:12.5px;color:var(--muted)}
@media (max-width:600px){.topright{align-items:flex-start}}
.privacy{font-size:12.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 12px;white-space:nowrap}

/* rounds */
.round{padding-block:28px;border-bottom:1px solid var(--line);display:grid;gap:18px}
.round>header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.rn{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
.round h2{font-size:21px;font-weight:700}
.round header .hint{flex-basis:100%}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--raise);border-radius:var(--r);padding:7px 14px;cursor:pointer;font-weight:500;line-height:1.3}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* R1 */
.drop{display:flex;gap:16px;align-items:center;flex-wrap:wrap;border:2px dashed var(--line);border-radius:10px;padding:18px 20px;background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.drop .ico{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;color:var(--accent);font-size:20px;font-weight:700}
.drop strong{font-size:16px}
.drop .txt{min-width:0;flex:1}
.filemeta{display:flex;gap:8px 22px;flex-wrap:wrap;font-size:13.5px}
.filemeta span b{font-family:var(--f-mono);font-weight:600}
.tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.06em;border-radius:4px;padding:1px 7px;background:var(--accent-soft);color:var(--accent);vertical-align:1px}
.status{display:flex;gap:12px;align-items:center;font-size:13.5px;color:var(--muted);min-height:22px}
.pbar{flex:none;width:140px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s}

/* R2 tempo */
.tempo{display:grid;grid-template-columns:minmax(200px,240px) 1fr;gap:18px}
@media (max-width:760px){.tempo{grid-template-columns:1fr}}
.bpmcard{background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:grid;gap:6px;align-content:start}
.bpmcard .lbl{font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;font-family:var(--f-display);font-weight:600}
.bpmbig{font-family:var(--f-display);font-weight:700;font-size:64px;line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.bpmbig small{font-size:20px;color:var(--muted);margin-left:4px;letter-spacing:.08em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tools{display:grid;gap:14px;min-width:0}
.tool{display:grid;gap:8px}
.tool h3{font-size:14px;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--raise);border-radius:999px;padding:4px 12px;cursor:pointer;font-family:var(--f-mono);font-size:13px;display:inline-flex;gap:8px;align-items:center}
.chip .src{font-family:var(--f-body);font-size:11px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.field{display:inline-flex;align-items:center;gap:6px;font-size:13.5px}
.field input[type=number]{width:92px;padding:5px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--raise);font-family:var(--f-mono)}
.tapbtn{min-width:110px;justify-content:center;font-family:var(--f-display);font-size:18px;letter-spacing:.1em;font-weight:700}
.tapbtn.hit{background:var(--accent-soft);border-color:var(--accent)}
.player{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.player select{padding:5px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--raise)}
.timecode{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.tlwrap{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--raise);padding:6px 6px 2px}
#tl{display:block;width:100%;height:190px;cursor:pointer;touch-action:pan-y}
.blocks{display:grid;gap:8px}
.blocks h3{font-size:14px;font-weight:700}
.blist{display:grid;gap:6px}
.brow{display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center;font-size:13px}
.brow .mono{min-width:9.5em}
.brow input{width:80px;padding:4px 6px;border:1px solid var(--line);border-radius:var(--r);background:var(--raise);font-family:var(--f-mono);font-size:13px}
.mini{position:fixed;top:0;left:0;right:0;z-index:8;background:var(--raise);border-bottom:1px solid var(--line);box-shadow:0 2px 12px rgb(0 0 0 / .12);padding:calc(6px + env(safe-area-inset-top,0px)) clamp(16px,4vw,32px) 6px}
.mini-in{max-width:1120px;margin:0 auto;display:flex;gap:10px;align-items:center}
#tlMini{flex:1;min-width:0;height:58px;display:block;cursor:pointer;touch-action:pan-y}
.mini-info{font-size:12px;color:var(--muted);white-space:nowrap}
@media (max-width:600px){.mini-info{display:none}}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend .hatch{background:repeating-linear-gradient(135deg,var(--muted) 0 2px,transparent 2px 5px)}

/* R3 settings */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--raise)}
.seg button{border:0;background:transparent;padding:8px 16px;cursor:pointer;font-weight:700;font-family:var(--f-display);font-size:17px;letter-spacing:.05em}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.setbar{display:flex;gap:12px 24px;flex-wrap:wrap;align-items:center}
.setbar select{padding:7px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--raise)}
.sliders{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.ctl{display:grid;align-content:start;gap:4px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
.ctl.off{opacity:.62}
.ctl-head{display:flex;align-items:center;gap:8px}
.ctl-head label{font-weight:700;flex:1}
.ctl-head output{font-family:var(--f-mono);font-size:14px;font-weight:600;min-width:3ch;text-align:right}
.ctl.off output{color:var(--muted)}
.sw{width:10px;height:22px;border-radius:2px;background:var(--c)}
input[type=range]{width:100%;accent-color:var(--accent)}
.subhead{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.panel{display:grid;gap:14px}
.ctl .sel{padding:6px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--raise);width:100%}
.bxintro{display:flex;gap:10px 24px;flex-wrap:wrap;align-items:center;padding:12px 14px;border-left:3px solid var(--accent);background:var(--surface);border-radius:0 8px 8px 0}
.bxintro p{margin:0;font-size:13.5px;max-width:70ch;flex:1 1 360px}
.bxintro select{padding:6px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--raise)}
.combos{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.combo{font-family:var(--f-mono);font-size:12.5px;border:1px solid var(--line);border-radius:4px;padding:2px 8px;background:var(--raise)}
.combo b{font-weight:600;color:var(--accent);margin-left:6px}
.combos small{flex-basis:100%}
details.adv{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
details.adv summary{cursor:pointer;padding:10px 14px;font-weight:700}
.advgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px 22px;padding:4px 14px 16px}
.opt{display:grid;gap:3px;min-width:0}
.opt label{font-weight:500;font-size:13.5px}
.opt .val{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13.5px}
.check input{margin-top:5px;accent-color:var(--accent)}

/* R4 result */
.result{display:grid;grid-template-columns:1.2fr 1fr;gap:22px}
@media (max-width:820px){.result{grid-template-columns:1fr}}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.num{border-left:3px solid var(--line);padding:2px 10px}
.num b{display:block;font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.num span{font-size:12px;color:var(--muted)}
.mix{display:grid;gap:6px;margin-top:14px}
.mixrow{display:grid;grid-template-columns:7em 1fr 4.5em;gap:10px;align-items:center;font-size:13px}
.mixrow .track{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.mixrow .track i{display:block;height:100%;background:var(--c)}
.mixrow .n{font-family:var(--f-mono);text-align:right;color:var(--muted);font-size:12.5px}
.export{display:grid;gap:12px;align-content:start}
.export .field{display:grid;gap:3px}
.export .field input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--raise)}
.fname{font-family:var(--f-mono);font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;overflow-wrap:anywhere}
.note{font-size:13px;color:var(--muted)}
.note.warn{color:var(--warn)}
.paths{font-size:12.5px;display:grid;gap:6px;padding:4px 14px 14px}
.paths code{font-family:var(--f-mono);font-size:12px;background:var(--bg);padding:2px 6px;border-radius:4px;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
textarea#jsonOut{width:100%;height:120px;font-family:var(--f-mono);font-size:11.5px;border:1px solid var(--line);border-radius:var(--r);background:var(--raise);padding:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
<header class="top">
  <div class="brand">
    <div class="mark" aria-hidden="true">PB</div>
    <div>
      <h1 data-i18n="title">PowerBeats Layout Workshop</h1>
      <p data-i18n="lead"></p>
    </div>
  </div>
  <div class="topright">
    <div class="seg langseg" role="group" aria-label="Language" id="langSeg"><button data-l="en">EN</button><button data-l="ja">日本語</button></div>
    <span class="privacy" data-i18n="privacy"></span>
  </div>
</header>

<section class="round" id="r1">
  <header><span class="rn">Round 1</span><h2 data-i18n="r1"></h2></header>
  <label class="drop" id="drop" for="fileAudio">
    <input type="file" id="fileAudio" accept="audio/*,.mp3,.wav,.ogg,.m4a">
    <span class="ico" aria-hidden="true">♪</span>
    <span class="txt" data-i18n-html="drop"></span>
  </label>
  <div class="filemeta" id="fileMeta"></div>
  <div class="status"><div class="pbar"><i id="prog"></i></div><span id="statusText"></span></div>
</section>

<section class="round" id="r2">
  <header><span class="rn">Round 2</span><h2 data-i18n="r2"></h2>
    <p class="hint" data-i18n="r2hint"></p></header>
  <div class="tempo">
    <div class="bpmcard">
      <span class="lbl">Tempo</span>
      <div class="bpmbig" id="bpmBig">—<small>BPM</small></div>
      <div class="row"><button class="btn sm" id="btnHalf" data-i18n-title="half">÷2</button><button class="btn sm" id="btnDouble" data-i18n-title="double">×2</button></div>
      <dl class="kv">
        <dt>offset</dt><dd id="kvOffset">—</dd>
        <dt data-i18n="kv.db"></dt><dd><span id="kvDb">—</span></dd>
        <dt data-i18n="kv.start"></dt><dd id="kvStart">—</dd>
        <dt data-i18n="kv.end"></dt><dd id="kvEnd">—</dd>
      </dl>
    </div>
    <div class="tools">
      <div class="tool">
        <h3 data-i18n="cands.h"></h3>
        <div class="chips" id="candList"></div>
        <small data-i18n="cands.note"></small>
      </div>
      <div class="tool">
        <h3 data-i18n="manual.h"></h3>
        <div class="row">
          <span class="field"><label for="bpmManual">BPM</label><input type="number" id="bpmManual" min="40" max="300" step="0.01"></span>
          <button class="btn sm" id="btnManual" data-i18n="manual.use"></button>
          <span style="width:12px"></span>
          <button class="btn tapbtn" id="btnTap" data-i18n-title="tap.title">TAP</button>
          <span class="mono" id="tapInfo" style="font-size:13px;color:var(--muted)"></span>
          <button class="btn sm" id="btnTapUse" disabled data-i18n="tap.use"></button>
          <button class="btn sm" id="btnTapReset" data-i18n="tap.reset"></button>
        </div>
      </div>
      <div class="tool">
        <h3 data-i18n="fine.h"></h3>
        <div class="row">
          <span class="field"><label for="nudge" data-i18n="nudge"></label><input type="range" id="nudge" min="-250" max="250" step="5" value="0" style="width:180px"><output class="mono" id="nudgeOut" style="font-size:13px">0 ms</output></span>
          <button class="btn sm" id="btnDbPrev" data-i18n="db.prev"></button>
          <button class="btn sm" id="btnDbNext" data-i18n="db.next"></button>
        </div>
      </div>
    </div>
  </div>
  <div class="player">
    <button class="btn" id="btnRew" data-i18n="rew" data-i18n-title="rew.title"></button>
    <button class="btn primary" id="btnPlay"></button>
    <label class="field"><span data-i18n="click"></span>
      <select id="clickMode"><option value="beat" data-i18n="click.beat"></option><option value="notes" data-i18n="click.notes"></option><option value="off" data-i18n="click.off"></option></select></label>
    <label class="field"><span data-i18n="vol"></span> <input type="range" id="vol" min="0" max="1" step="0.05" value="0.7" style="width:110px"></label>
    <span class="timecode" id="timecode">0:00.0</span>
    <small data-i18n="tl.hint"></small>
  </div>
  <div class="tlwrap"><canvas id="tl" data-i18n-aria="tl.aria"></canvas></div>
  <div class="legend" id="legend"></div>
  <div class="blocks">
    <div class="row"><h3 data-i18n="blocks.h"></h3><small data-i18n="blocks.hint"></small></div>
    <div id="blockList" class="blist"></div>
    <div class="row"><button class="btn sm" id="btnBlockHere" data-i18n="blocks.add"></button></div>
  </div>
</section>

<section class="round" id="r3">
  <header><span class="rn">Round 3</span><h2 data-i18n="r3"></h2>
    <p class="hint" data-i18n="r3hint"></p></header>
  <div class="setbar">
    <div class="seg" role="group" data-i18n-aria="diff.aria" id="diffSeg">
      <button data-d="Beginner">Beginner</button><button data-d="Advanced">Advanced</button><button data-d="Expert">Expert</button>
    </div>
    <label class="field"><span data-i18n="mode"></span>
      <select id="mode"><option value="standard" data-i18n="mode.std"></option><option value="boxercise" data-i18n="mode.bx"></option></select></label>
    <div class="row" id="presetRow"></div>
  </div>
  <div id="stdPanel" class="panel">
    <div class="subhead" data-i18n="sub.freq"></div>
    <div class="sliders" id="sliders"></div>
    <div class="subhead" data-i18n="sub.fine"></div>
    <div class="sliders" id="subSliders"></div>
  </div>
  <div id="bxPanel" class="panel" hidden>
    <div class="bxintro">
      <p data-i18n="bx.intro"></p>
      <label class="field"><span data-i18n="stance"></span>
        <select id="bxStance"><option value="orthodox" data-i18n="stance.o"></option><option value="southpaw" data-i18n="stance.s"></option><option value="switch" data-i18n="stance.sw"></option></select></label>
    </div>
    <div class="subhead" data-i18n="bx.amount"></div>
    <div class="sliders">
      <div class="ctl"><div class="ctl-head"><label for="bxInterval" data-i18n="bx.interval"></label></div>

/* ================= FFT ================= */
function makeFFT(n){
  const lv=Math.log2(n)|0, cs=new Float64Array(n/2), sn=new Float64Array(n/2), rev=new Uint32Array(n);
  for(let i=0;i<n/2;i++){cs[i]=Math.cos(2*Math.PI*i/n);sn[i]=Math.sin(2*Math.PI*i/n)}
  for(let i=0;i<n;i++){let r=0,x=i;for(let j=0;j<lv;j++){r=(r<<1)|(x&1);x>>=1}rev[i]=r}
  return (re,im)=>{
    for(let i=0;i<n;i++){const j=rev[i];if(j>i){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t}}
    for(let size=2;size<=n;size<<=1){const h=size>>1,st=n/size;
      for(let i=0;i<n;i+=size){for(let j=i,k=0;j<i+h;j++,k+=st){const l=j+h,c=cs[k],s=sn[k];
        const tr=re[l]*c+im[l]*s, ti=im[l]*c-re[l]*s; re[l]=re[j]-tr; im[l]=im[j]-ti; re[j]+=tr; im[j]+=ti}}}
  };
}
const hann=n=>{const w=new Float64Array(n);for(let i=0;i<n;i++)w[i]=0.5-0.5*Math.cos(2*Math.PI*i/n);return w};

/* ================= Audio analysis ================= */
async function decodeToMono(arrayBuf){
  const tmp=new OfflineAudioContext(1,1,44100);
  const buf=await tmp.decodeAudioData(arrayBuf);
  return buf;
}
async function resampleMono(buf){
  const len=Math.ceil(buf.duration*SR);
  const oc=new OfflineAudioContext(1,len,SR);
  const s=oc.createBufferSource(); s.buffer=buf; s.connect(oc.destination); s.start();
  const r=await oc.startRendering(); return r.getChannelData(0);
}
function movAvgSub(e,w){ // high-pass by moving average, half-wave
  const n=e.length,ps=new Float64Array(n+1),o=new Float32Array(n);

  let s=0;for(let i=0;i<n;i++)s+=o[i]*o[i]; s=Math.sqrt(s/n)||1;
  for(let i=0;i<n;i++)o[i]/=s; return o;
}
function gaussSmooth(e,sig){

  for(let i=0;i<n;i++){let s=0;for(let j=-r;j<=r;j++){const q=i+j;if(q>=0&&q<n)s+=e[q]*k[j+r]}o[i]=s/ks}return o;
}
async function analyze(x,progress){
  const fps=SR/H1, T=Math.max(2,Math.floor((x.length-N1)/H1)+1);
  const fft=makeFFT(N1), win=hann(N1), re=new Float64Array(N1), im=new Float64Array(N1);
  const binHz=SR/N1, lowMax=Math.round(150/binHz), hiMin=Math.round(2000/binHz), hiMax=Math.round(8000/binHz), fMax=Math.round(9000/binHz);
  let prev=new Float32Array(N1/2+1), cur=new Float32Array(N1/2+1);
  const full=new Float32Array(T), low=new Float32Array(T), hi=new Float32Array(T), rmsDb=new Float32Array(T);
  for(let t=0;t<T;t++){
    const o=t*H1; let e=0;
    for(let i=0;i<N1;i++){re[i]=(x[o+i]||0)*win[i];im[i]=0}
    for(let i=o+(N1-H1)/2;i<o+(N1+H1)/2;i++){const v=x[i]||0;e+=v*v}
    rmsDb[t]=10*Math.log10(e/H1+1e-12);
    fft(re,im);
    let f=0,l=0,h=0;
    for(let k=1;k<=fMax;k++){const m=Math.log1p(10*Math.sqrt(re[k]*re[k]+im[k]*im[k]));cur[k]=m;const d=m-prev[k];
      if(d>0){f+=d;if(k<=lowMax)l+=d;else if(k>=hiMin&&k<=hiMax)h+=d}}
    full[t]=f;low[t]=l;hi[t]=h; const sw=prev;prev=cur;cur=sw;
    if((t&2047)===0){progress(0.05+0.55*t/T);await tick()}
  }

  const T2=Math.max(1,Math.floor((x.length-N2)/H2)+1), fft2=makeFFT(N2), win2=hann(N2), re2=new Float64Array(N2), im2=new Float64Array(N2);
  const pc=new Int8Array(N2/2+1).fill(-1), band=new Int8Array(N2/2+1).fill(-1);
  for(let k=1;k<=N2/2;k++){const f=k*SR/N2;
    if(f>=60&&f<=2100)pc[k]=((Math.round(12*Math.log2(f/440))+69)%12+12)%12;
    if(f>=80&&f<10000)band[k]=Math.min(11,Math.floor(12*Math.log(f/80)/Math.log(10000/80)))}

  for(let t=0;t<T2;t++){
    const o=t*H2;for(let i=0;i<N2;i++){re2[i]=(x[o+i]||0)*win2[i];im2[i]=0}
    fft2(re2,im2);

      if(pc[k]>=0)chroma[t*12+pc[k]]+=Math.sqrt(p2); if(band[k]>=0)timbre[t*12+band[k]]+=p2}
    for(let b=0;b<12;b++)timbre[t*12+b]=Math.log10(timbre[t*12+b]+1e-9);
    if((t&255)===0){progress(0.6+0.3*t/T2);await tick()}
  }
  const wHP=Math.round(0.25*fps);
  const env={full:movAvgSub(full,wHP),low:movAvgSub(low,wHP),hi:movAvgSub(hi,wHP)};
  env.drum=new Float32Array(T);for(let i=0;i<T;i++)env.drum[i]=env.low[i]+env.hi[i];
  env.comb=new Float32Array(T);for(let i=0;i<T;i++)env.comb[i]=env.full[i]+0.5*env.drum[i];
  env.combS=gaussSmooth(env.comb,1.5); env.lowS=gaussSmooth(env.low,2);
  return {dur:x.length/SR,fps,T,T2,env,rmsDb,chroma,timbre,tc:ONSET_TC,
          f2t:t=>(t*H2+N2/2)/SR, rmsT:t=>(t*H1+N1/2)/SR};
}
const ONSET_TC=0.03; // onset-frame → time calibration (s), measured on synthetic clicks

/* ---------- tempo ---------- */
function acfPeaks(e,fps,minB=55,maxB=230){
  const T=e.length, lagMin=Math.floor(60*fps/maxB), lagMax=Math.ceil(60*fps/minB), L=2*lagMax+2;
  const acf=new Float64Array(L+1);
  for(let lag=lagMin;lag<=L;lag++){let s=0;for(let t=0;t+lag<T;t++)s+=e[t]*e[t+lag];acf[lag]=s/Math.max(1,T-lag)}
  const sc=new Float64Array(lagMax+2);
  for(let lag=lagMin;lag<=lagMax;lag++){const b=60*fps/lag;const pr=Math.exp(-0.5*Math.pow(Math.log2(b/120)/0.9,2));
    sc[lag]=(acf[lag]+0.5*acf[2*lag])*pr}
  const pk=[];
  for(let lag=lagMin+1;lag<lagMax;lag++){if(sc[lag]>sc[lag-1]&&sc[lag]>=sc[lag+1]){
    const a=sc[lag-1],b=sc[lag],c=sc[lag+1],den=a-2*b+c,d=den?0.5*(a-c)/den:0;pk.push({bpm:60*fps/(lag+d),s:b})}}
  pk.sort((p,q)=>q.s-p.s); const mx=pk.length?pk[0].s:1;
  return pk.slice(0,4).map(p=>({bpm:p.bpm,s:p.s/mx}));
}
function combBest(e,fps,bpm,phStep=1){
  const P=60*fps/bpm,T=e.length;let best=-1,bp=0;

  return {score:best,phase:bp};
}
function refineBpm(A,bpm,range=0.015){
  const e=A.env.combS,fps=A.fps;let best={bpm,...combBest(e,fps,bpm)};

  for(let b=c-st;b<=c+st;b+=st/12){const r=combBest(e,fps,b,0.5);if(r.score>best.score)best={bpm:b,...r}}
  const bi=Math.round(best.bpm);
  if(Math.abs(bi-best.bpm)<Math.max(0.6,st*2)){const r=combBest(e,fps,bi,0.25);if(r.score>=0.985*best.score)best={bpm:bi,...r,snapped:true}}

  const f=combBest(e,fps,best.bpm,0.1);best.phase=f.phase;best.score=f.score;
  return best;

function phaseToSec(A,phase,bpm){const p=60/bpm;const t=phase/A.fps+A.tc;return ((t%p)+p)%p}

    const h=m.find(q=>Math.abs(q.bpm-p.bpm)/p.bpm<0.02);
    if(h){h.s+=p.s;if(!h.src.includes(lab))h.src.push(lab)}else m.push({bpm:p.bpm,s:p.s,src:[lab]})}}

    if(out.some(o=>Math.abs(o.bpm-r.bpm)<0.3))continue;

function estimateDownbeat(A,bpm,phase0){
  const p=60/bpm,K=Math.floor((A.dur-phase0)/p),lo=[],ch=[];

    for(let f=f0;f<Math.max(f1,f0+1)&&f<A.T2;f++)for(let b=0;b<12;b++)v[b]+=A.chroma[f*12+b];let n=0;for(let b=0;b<12;b++)n+=v[b]*v[b];n=Math.sqrt(n)||1;for(let b=0;b<12;b++)v[b]/=n;return v};

/* ---------- beat features, silence, energy, repeats ---------- */
function soundRange(A,rel){
  const v=Array.from(A.rmsDb).filter(x=>x>-100).sort((a,b)=>a-b);
  const p95=v.length?v[Math.floor(v.length*0.95)]:-20, thr=Math.max(p95+rel,-75);
  let s=0,e=A.T-1;
  for(let i=0;i+4<A.T;i++){let ok=true;for(let j=0;j<5;j++)if(A.rmsDb[i+j]<thr){ok=false;break}if(ok){s=i;break}}
  for(let i=A.T-1;i>=4;i--){let ok=true;for(let j=0;j<5;j++)if(A.rmsDb[i-j]<thr){ok=false;break}if(ok){e=i;break}}
  return {thr,start:A.rmsT(s),end:A.rmsT(e)};
}
function beatFeatures(A,bpm,offset,snd){

    silent[k]=(mx<snd.thr||t0<snd.start-p*0.5||t0>snd.end)?1:0;
    const g0=Math.max(0,Math.ceil((t0*SR-N2/2)/H2)),g1=Math.min(A.T2,Math.ceil((t1*SR-N2/2)/H2));
    const ga=g0<g1?g0:Math.min(A.T2-1,Math.max(0,Math.round((t0*SR-N2/2)/H2))),gb=g0<g1?g1:ga+1;

  }

    let best=-1,bl=0;for(let L=minLag;L<=a;L++){const v=sm(a,L);if(v>best){best=v;bl=L}}

  return {lag,nb,bE};
}

    w*=Math.exp(0.45*lb*(n-2.5));

function planBoxercise(ctx){
  const B=ctx.bx,rng=ctx.rng,lvl=ctx.level,dIdx={Beginner:0,Advanced:1,Expert:2}[ctx.diff];
  if(ctx.avail<4)return null;
  // breather: a stream in quiet passages
  if(B.STREAM>0&&ctx.avail>=8&&ctx.last!=='STREAM'){
    const pS=(B.STREAM/10)*(ctx.streamCalm?[1.1,0.25,0.02]:[0.6,0.3,0.15])[lvl];
    if(rng()<pS){const len=ctx.avail>=12&&rng()<0.4?12:8,step=stepFor(ctx.diff,lvl,'STREAM',ctx.bpm,ctx.density);
      const b=BUILD.STREAM({...ctx,len,step});if(b)return {cat:'STREAM',len,step,...b,combos:[]}}}
  const step=B.interval==='1'?1:B.interval==='2'?2:stepFor(ctx.diff,lvl,'BALLS',ctx.bpm,ctx.density);
  const restMin=B.rest??[2,1,0][dIdx];
  const ulen=ctx.avail>=8&&(step>=2||rng()<0.65)?8:4;
  let pool=bxPool(B,dIdx,lvl);if(!pool.length)pool=[{c:'1-2',toks:['1','2'],w:1}];
  const stance=ctx.stance==='southpaw'?-1:ctx.stance==='switch'?((Math.floor(ctx.cur/64)%2)?-1:1):1;
  const L=-stance,Rs=stance; // x sign of lead hand side / rear hand side
  const headY=rr(rng,0.12,0.24),cx=rr(rng,-0.08,0.08),duckH=rr(rng,0.18,0.27),ent=new Ent(),used=[];
  const pw=()=>rng()<ctx.powerP?'PowerBall':'NormalBall';
  const put=(r,t)=>{switch(t){
    case '1':ent.add(r,ball('NormalBall',cx+L*0.2,headY+0.03));break;
    case '2':ent.add(r,ball(pw(),cx+Rs*0.14,headY));break;
    case '3':ent.swing(r,swing(cx+L*0.62,headY,'side',-L,0));break;
    case '4':ent.swing(r,swing(cx+Rs*0.62,headY,'side',-Rs,0));break;
    case '5':ent.swing(r,swing(cx+L*0.24,-0.32,'vert',0,1));break;
    case '6':ent.swing(r,swing(cx+Rs*0.2,-0.32,'vert',0,1));break;
    case '1b':ent.add(r,ball('NormalBall',cx+L*0.24,-0.3));break;
    case '2b':ent.add(r,ball(pw(),cx+Rs*0.18,-0.32));break;
    case '3b':ent.swing(r,swing(cx+L*0.62,-0.3,'side',-L,0));break;
    case 'SL':ent.add(r,wall(0,Rs*0.55,-1.3,0.1));break;   // head moves to the lead side, wall on the rear side
    case 'SR':ent.add(r,wall(0,L*0.55,-1.3,0.1));break;
    case 'D':ent.add(r,wall(7,0,duckH,0.1));break}};
  let pos=0,prev=null,hasD=false,hasS=false,hasSw=false;
  while(pos<ulen){
    const room=ulen-pos;let cand=pool.filter(q=>(q.toks.length-1)*step+1+restMin<=room);
    if(pos===0&&!cand.some(q=>q.toks.length>1)){const multi=pool.filter(q=>q.toks.length>1&&(q.toks.length-1)*step+1<=room);if(multi.length&&(!cand.length||rng()<0.7))cand=multi}
    if(!cand.length)break;
    if(pos>0&&restMin>0&&cand.every(q=>q.toks.length===1)&&rng()<0.7)break; // leave a breather instead of a lone filler jab
    let pick=null;
    if(prev&&cand.includes(prev)&&rng()<0.5)pick=prev; // drill the same combination twice
    else{const wt={};cand.forEach((q,i)=>wt[i]=q.w*(q.c===ctx.mem.lastCombo?0.4:1));pick=cand[+wpick(rng,wt)]}
    pick.toks.forEach((t,i)=>{put(pos+i*step,t);if(t==='D')hasD=true;if(t[0]==='S')hasS=true;if('3456'.includes(t[0]))hasSw=true});
    used.push(pick.c);ctx.mem.lastCombo=pick.c;prev=pick;
    const end=pos+(pick.toks.length-1)*step;pos=Math.ceil((end+1+restMin)/2)*2;
  }
  if(!used.length)return null;
  ent.at(0);
  const cat=hasD?'SQUAT':hasS?'DODGE':hasSw?'SWINGS':'BALLS';
  const st=stance>0?'orthodox':'southpaw';
  return {cat,len:ulen,step,sub:used.join(' / '),ent,combos:used,stance:st,
    label:`BOXING: beats: ${ulen} | combo: ${used.join(' / ')} | stance: ${st} | isHalf: False\nrepetitions: 0 | advance: ${step}`};
}
const PLANNERS={standard:planStandard,boxercise:planBoxercise};

/* ---------- generator ---------- */
function cloneInst(src,start,mirror){
  const ent=new Ent();
  for(const [r,e] of src.ent.m){const f=a=>{const o=JSON.parse(JSON.stringify(a));if(mirror){o.position[0]=R3(-o.position[0]);if(o.action==='Stream')o.id=o.id==='A'?'B':'A'}return o};
    const n=ent.at(r);n.a=e.a.map(f);n.s1=e.s1.map(f);n.s2=e.s2.map(f)}
  return {...src,start,ent,copyOf:src.start,mirrored:!!mirror};
}
function generate(){
  const A=state.A,F=state.F,LG=state.LG;if(!A||!F)return null;
  const S=state.settings[state.diff],O=state.opts,T=state.tempo;
  const rng=mulberry32(O.seed*7919+['Beginner','Advanced','Expert'].indexOf(state.diff)*101+1);
  const p=60/T.bpm,off=offsetOf();
  const BX=state.bx[state.diff],isBx=state.mode==='boxercise';
  const w={};let allZero=true;for(const c of CAT_IDS){w[c]=S[c];if(S[c]>0)allZero=false}
  if(isBx)allZero=BX_ELEMS.every(e=>!(BX[e.id]>0));
  const o={double:S.double,spike:S.spike,duckOK:S.SQUAT>0};
  const powerP=(isBx?BX.power:S.power)/10,mem={};
  let start=Math.ceil((Math.max(state.snd.start,O.leadIn)-off)/p-1e-6);start=Math.max(0,Math.ceil(start/4)*4);
  const endBeat=Math.min(F.K-1,Math.floor((state.snd.end-off)/p));
  const lag=O.repeat?LG.lag:new Int32Array(LG.nb);
  const inst=[],byStart=new Map(),planner=PLANNERS[state.mode]||planStandard;
  let cur=start,last=null;
  const SIL=blockMask();
  const nextCopyStart=bar=>{for(let b=bar+1;b<LG.nb;b++)if(lag[b]>0&&lag[b]!==lag[b-1])return b*4;return Infinity};
  const levelAt=b=>{let e=0;for(let k=b;k<b+4&&k<F.K;k++)e+=F.energy[k];e=e/4+0.0;return e<0.35?0:e>0.72?2:1};
  const hitsSilent=(ins)=>{for(const [r,e] of ins.ent.m)if(e.a.length&&(ins.start+r>endBeat||SIL[ins.start+r]))return true;return false};
  let guard=0;
  while(cur+4<=endBeat+1&&guard++<5000){
    const bar=cur>>2,L=bar<LG.nb?lag[bar]:0;
    let limit=endBeat+1-cur;
    if(L>0){
      let e=bar;while(e+1<LG.nb&&lag[e+1]===L)e++;const regionEnd=(e+1)*4;
      const src=byStart.get(cur-4*L);
      if(src&&cur+src.len<=Math.min(regionEnd,endBeat+1)){const c=cloneInst(src,cur,O.mirror);
        if(!hitsSilent(c)){inst.push(c);byStart.set(cur,c);cur+=c.len;last=c.cat;continue}}
      let nx=regionEnd;for(let q=cur-4*L+4;q<regionEnd-4*L;q+=4)if(byStart.has(q)){nx=q+4*L;break}
      limit=Math.min(limit,nx-cur);
    }else limit=Math.min(limit,nextCopyStart(bar)-cur);
    let sil=0;for(let k=cur;k<cur+4;k++)if(SIL[k])sil++;
    if(sil>=2||limit<4){cur+=4;last=null;continue}
    let avail=limit;
    for(let k=cur;k<cur+avail;k++)if(SIL[k]){avail=Math.floor((k-cur)/4)*4;break}
    if(avail<4){cur+=4;last=null;continue}
    const ctx={rng,bx:BX,stance:O.stance,cur,mem,streamCalm:O.streamCalm,diff:state.diff,bpm:T.bpm,density:O.density,w,allZero,o,powerP,last,level:levelAt(cur),avail:Math.min(avail,16),side:rng()<0.5?1:-1};
    const pl=planner(ctx);
    if(!pl){cur+=4;last=null;continue}
    const ins={start:cur,len:pl.len,cat:pl.cat,sub:pl.sub,step:pl.step,label:pl.label,ent:pl.ent,copyOf:null,combos:pl.combos||[],stance:pl.stance};
    if(hitsSilent(ins)){cur+=4;last=null;continue}
    inst.push(ins);byStart.set(cur,ins);cur+=pl.len;last=pl.cat;
  }
  // serialize
  const beats=[];
  for(const ins of inst){ins.ent.at(0);
    const rs=[...ins.ent.m.keys()].sort((a,b)=>a-b);
    for(const r of rs){const e=ins.ent.m.get(r);
      let label=r===0?ins.label:'';
      if(r===0&&ins.copyOf!=null)label+=` | copy: bar ${(ins.copyOf>>2)+1}${ins.mirrored?' mirrored':''}`;
      beats.push({beatNo:ins.start+r,beatLabel:label,actions:e.a,subBeats:(e.s1.length||e.s2.length)?[{offset:0.0625,actions:e.s1},{offset:0.125,actions:e.s2}]:[]})}}

    beats.push({beatNo:kEnd,beatLabel:'END: keeps the song playing to the end',actions:O.endMode==='ball'?[ball('NormalBall',0,0.1)]:[],subBeats:[]});endMarker=kEnd}
  return {inst,beats,start,endBeat,allZero,endMarker};
}

  const out={name:$('#metaName').value||state.baseName,author:$('#metaAuthor').value||'AutoGen+',bpm,offset:off,schemaVersion:2,Beginner:blank(),Advanced:blank(),Expert:blank()};
  let note='',warn=false;
  if(state.existing&&$('#optMerge').checked){const j=state.existing;
    if(Math.abs(+j.bpm-bpm)<1e-6&&Math.abs(+j.offset-off)<5e-4){for(const d of ['Beginner','Advanced','Expert'])if(d!==state.diff)out[d]=j[d];out.offset=+j.offset;note=t('json.kept')}
    else{note=t('json.mismatch');warn=true}}
  out[state.diff]={isGenerated:false,beats:R.beats,maxHighscore:0};
  return {json:JSON.stringify(out,null,2),note,warn};
}

/* ================= Demo song (synthesized) ================= */
async function synthDemo(){
  const sr=44100,bpm=112,spb=60/bpm,bar=4*spb,lead=1.6;
  const plan=[['intro',4],['A',8],['B',8],['A',8],['B',8],['C',4],['B',8],['out',2]];
  const bars=plan.reduce((s,p)=>s+p[1],0),dur=lead+bars*bar+2.5;
  const oc=new OfflineAudioContext(2,Math.ceil(dur*sr),sr),master=oc.createGain();master.gain.value=0.5;master.connect(oc.destination);
  const nb=oc.createBuffer(1,sr,sr),nd=nb.getChannelData(0);let seed=7;for(let i=0;i<sr;i++){seed=(seed*16807)%2147483647;nd[i]=seed/1073741823.5-1}
  const env=(g,t,a,d,v)=>{g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d)};
  const kick=(t,v)=>{const o=oc.createOscillator(),g=oc.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+0.12);env(g,t,0.003,0.32,v);o.connect(g).connect(master);o.start(t);o.stop(t+0.4)};
  const noise=(t,v,type,f,d)=>{const s=oc.createBufferSource(),fl=oc.createBiquadFilter(),g=oc.createGain();s.buffer=nb;fl.type=type;fl.frequency.value=f;env(g,t,0.002,d,v);s.connect(fl).connect(g).connect(master);s.start(t,Math.random()*0.5);s.stop(t+d+0.05)};
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  const pad=(t,d,notes,v)=>{for(const m of notes){const o=oc.createOscillator(),fl=oc.createBiquadFilter(),g=oc.createGain();o.type='sawtooth';o.frequency.value=mtof(m);fl.type='lowpass';fl.frequency.value=1600;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.04);g.gain.setValueAtTime(v,t+d-0.08);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(fl).connect(g).connect(master);o.start(t);o.stop(t+d+0.02)}};
  const CH={Am:[57,60,64],F:[53,57,60],C:[48,55,64],G:[55,59,62],Em:[52,55,59],Dm:[50,57,62],E:[52,56,59]};
  const prog={intro:['Am','Am','F','F'],A:['Am','F','C','G'],B:['F','G','Em','Am'],C:['Dm','Dm','E','E'],out:['Am','Am']};
  let t=lead;
  for(const [sec,n] of plan){for(let b=0;b<n;b++){const ch=CH[prog[sec][b%prog[sec].length]];
    const lvl=sec==='B'?1:sec==='A'?0.65:sec==='C'?0.35:0.3;
    pad(t,bar,ch,0.05*lvl+0.012);pad(t,bar,[ch[0]-12],0.06*lvl+0.01);
    for(let q=0;q<4;q++){const tb=t+q*spb;
      if(sec!=='C'&&sec!=='out'){if(sec==='B'||q%2===0)kick(tb,0.9*lvl+0.1);if(q%2===1&&sec!=='intro')noise(tb,0.5*lvl,'bandpass',1800,0.16)}
      if(sec!=='out'){noise(tb,0.12*lvl+0.03,'highpass',7000,0.04);noise(tb+spb/2,0.08*lvl+0.02,'highpass',7000,0.03)}
      if(sec==='B'&&q===3&&b%4===3)noise(tb+spb/2,0.35,'bandpass',1800,0.12)}
    t+=bar}}
  return await oc.startRendering();
}
